  #app { position:fixed; top:var(--app-top,0px); left:50%; transform:translateX(-50%); width:100%; max-width:560px; height:var(--app-h, 100dvh); display:flex; flex-direction:column; overflow:hidden; }
  /* Right pane wraps the existing header+main+nav; on mobile it's the only visible pane */
  #rightPane{ display:flex; flex-direction:column; flex:1; min-width:0; height:100%; overflow:hidden; }
  #leftPane{ display:none; }
  #leftPane.hidden{ display:none !important; }
  #navRail{ display:none; }
  #navRail.hidden{ display:none !important; }
  @media (min-width:900px){
    #navRail{ display:flex; flex-direction:column; align-items:center; width:64px; min-width:64px; height:100%; background:var(--panel); border-right:1px solid var(--border); padding:12px 0; gap:6px; }
    #navRail .nr-btn{ width:44px; height:44px; border:none; border-radius:50%; background:transparent; color:var(--muted); display:grid; place-items:center; cursor:pointer; position:relative; transition:background .15s,color .15s; }
    #navRail .nr-btn:hover{ background:var(--hover,rgba(127,127,127,.15)); color:var(--text); }
    #navRail .nr-btn.active{ background:var(--accent); color:#04222e; }
    #navRail .nr-btn svg{ width:24px; height:24px; }
    #navRail .nr-dot{ position:absolute; top:6px; right:6px; min-width:9px; height:9px; padding:0 3px; border-radius:9px; background:#e5484d; color:#fff; font-size:9px; line-height:9px; font-weight:700; display:flex; align-items:center; justify-content:center; }
    #navRail .nr-spacer{ flex:1; }
    #navRail .nr-avatar{ width:42px; height:42px; border-radius:50%; overflow:hidden; cursor:pointer; border:2px solid transparent; }
    #navRail .nr-avatar:hover{ border-color:var(--accent); }
    #navRail .nr-avatar .avatar{ width:100%; height:100%; margin:0; }
  }
  @media (min-width:900px){ #app{ max-width:1100px; } main{ padding:18px 40px; } .bubble{ max-width:60%; } }
  @media (min-width:1400px){ #app{ max-width:100%; } main{ padding:20px 8%; } }
  /* ===== Desktop two-pane (WhatsApp Web style) — solo da PC ===== */
  @media (min-width:900px){
    #app{ flex-direction:row; }
    #leftPane{ display:flex; flex-direction:column; width:380px; min-width:340px; max-width:420px; height:100%; background:var(--panel); border-right:1px solid var(--border); overflow:hidden; }
    #leftPane #leftHeader{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--panel); flex:none; }
    #leftPane #leftHeader .appicon{ width:34px; height:34px; }
    #leftPane #leftHeader .title{ font-weight:800; color:var(--accent); font-size:20px; margin-right:auto; }
    #leftPane #leftMain{ flex:1; overflow-y:auto; min-height:0; padding:6px 0 10px; }
    #leftPane .dmsearch{ padding:8px 12px; }
    #leftPane .list-item{ cursor:pointer; }
    #leftPane .list-item.activechat{ background:var(--accent); color:#04222e; }
    #leftPane .list-item.activechat .li-prev,#leftPane .list-item.activechat .li-time{ color:rgba(4,34,46,.75); }
    /* tighten right pane padding; chat view manages its own spacing */
    #rightPane > main{ padding:14px 22px; }
    #rightPane > main.chatview{ padding:0; }
  }
  /* Empty right-pane placeholder */
  .dmempty{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--muted); gap:14px; height:100%; padding:20px; }
  .dmempty .mascot{ width:120px; height:120px; opacity:.9; }
  .dmempty h2{ color:var(--text); font-weight:800; margin:0; }
  header { background:var(--panel); padding:12px 14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); flex:none; }
  header .appicon { width:44px; height:44px; flex:none; object-fit:contain; }
  header .title { font-weight:700; font-size:18px; color:var(--accent); flex:1; display:flex; align-items:center; gap:8px; }
  header .title .hAvatar { width:32px; height:32px; border-radius:50%; object-fit:cover; flex:none; display:grid; place-items:center; color:#1e1e1e; font-weight:700; font-size:15px; }
  header .title .hcol{display:flex;flex-direction:column;line-height:1.1}
  header .title .hstatus{font-size:12px;font-weight:500;color:#25d366}
  header button.icon { background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; padding:4px 8px; }
  header button.icon.hdract,header button.icon.svgic{ display:inline-grid; place-items:center; padding:4px 6px; }
  header button.icon.hdract svg,header button.icon.svgic svg{ display:block; }
  .vbadge{display:inline-flex;align-items:center;vertical-align:middle;flex:none}
  .langmenu{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:40;overflow:hidden;min-width:150px}
  .langmenu div{padding:11px 14px;cursor:pointer;font-size:15px;display:flex;align-items:center;gap:8px}
  .langmenu div:hover{background:var(--panel2)}
  .langmenu div.sel{color:var(--accent);font-weight:700}
  main { flex:1; overflow-y:auto; padding:14px; min-height:0; }
  main.chatview{ display:flex; flex-direction:column; overflow:hidden; }
  main.chatview #chatScroll{ flex:1 1 auto; overflow-y:auto; min-height:0; }
  main.chatview .composer{ position:static; flex:none; }

async function isContact(otherId){ try{ const lo=Math.min(App.me.id,otherId),hi=Math.max(App.me.id,otherId); const r=await rest('/dm_threads?user_lo=eq.'+lo+'&user_hi=eq.'+hi+'&select=id'); return Array.isArray(r)&&r.length>0; }catch(e){ return false; } }
// A: fetch the authoritative key for a contact from the server keybag (single
// source of truth). Caches it locally and returns it, or null.
async function serverKeyForUser(nick){
  const kb=kbKey(); if(!kb||!App.me) return null;
  try{ const rows=await rest('/keybag?user_id=eq.'+App.me.id+'&other_nick=eq.'+encodeURIComponent(String(nick).toLowerCase())+'&select=enc_key'); if(Array.isArray(rows)&&rows.length){ const k=kbDecrypt(rows[0].enc_key); if(k&&k!=='[locked]'&&!isBadKey(k)){ setKeyForUser(nick,k); return k; } } }catch(e){}
  return null;
}
async function sendDmRequestTo(toNick){
  try{
    const other=await rest('/users?nickname=eq.'+encodeURIComponent(toNick)+'&select=id,nickname');
    if(!other||!other.length){ toast(T('noUserNick')); return; }
    if(other[0].id===App.me.id){ toast(T('cannotDMself')); return; }
    const lo=Math.min(App.me.id,other[0].id),hi=Math.max(App.me.id,other[0].id);
    const ex=await rest('/dm_threads?user_lo=eq.'+lo+'&user_hi=eq.'+hi+'&select=id');
    if(ex&&ex.length){ toast(T('alreadyChat')); return; }
    // Brand-new chat (no thread yet): ALWAYS mint a fresh key indexed by the
    // recipient's stable users.id. Never reuse a key found only by nickname — a
    // reused nickname (e.g. a just-registered user) would otherwise collide with
    // a different person's key and cause "Unable to decrypt".
    let key=randomKey();
    await rememberKey(App.me.id,toNick,key,other[0].id);
    await rest('/dm_requests',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:{from_id:App.me.id,to_id:other[0].id,from_nick:App.me.nickname,thread_key:key,status:'pending'}});
    toast(T('requestSent'));
  }catch(e){ toast(T('couldNotSendReq')); }
}
async function showUserCard(nick, opts){
  opts=opts||{};
  if(!nick) return;
  let u=null; try{ const r=await rest('/users?nickname=eq.'+encodeURIComponent(nick)+'&select=id,nickname,avatar_id,avatar_url,verified,status'); if(Array.isArray(r)&&r.length)u=r[0]; }catch(e){}
  if(!u){ toast(T('noUserNick')); return; }
  const bg=el('div','modal-bg');const md=el('div','modal');md.style.textAlign='center';
  let big; if(u.avatar_url){ big=document.createElement('img'); big.src=u.avatar_url; big.style.objectFit='cover'; } else { big=avatarEl(u.nickname,u.avatar_id); big.style.fontSize='44px'; }
  big.style.width='140px';big.style.height='140px';big.style.borderRadius='50%';big.style.margin='0 auto';big.style.display='block';md.appendChild(big);
  const nm=el('div');nm.style.marginTop='10px';nm.style.fontSize='20px';nm.style.fontWeight='700';nm.style.display='flex';nm.style.justifyContent='center';nm.style.alignItems='center';nm.style.gap='6px';nm.appendChild(document.createTextNode(u.nickname));if(u.verified)nm.appendChild(verifiedBadge());md.appendChild(nm);
  let canSeeStatus = (u.id===App.me.id);
  if(!canSeeStatus && opts.knownContact) canSeeStatus=true;
  if(!canSeeStatus && opts.checkContact){ canSeeStatus=await isContact(u.id); }
  if(canSeeStatus && u.status){ const stx=el('div','muted');stx.style.marginTop='6px';stx.style.fontSize='14px';stx.textContent=u.status;md.appendChild(stx); }
  md.appendChild(el('div','spacer'));
  const col=el('div','col');
  if(!opts.noDm){ const dm=el('button','btn',T('sendDmReq'));dm.onclick=async()=>{ bg.remove(); await sendDmRequestTo(u.nickname); };col.appendChild(dm); }
  const cl=el('button','btn dark',T('cancel'));cl.onclick=()=>bg.remove();
  col.appendChild(cl);md.appendChild(col);
  bg.appendChild(md);document.body.appendChild(bg);
}

// Upload an image in TWO versions:
//  - small (watch quality) -> Supabase storage (shown on smartwatch)
//  - original (full quality) -> external free/temporary host (shown on web/PC)
// Returns "WKM1|img|url2|<smallUrl>|<origUrl>". Falls back to single 'img|url'.
async function uploadDualImage(origBlob){
  return new Promise((resolve)=>{
    const img=new Image();
    img.onload=async()=>{
      // Build small (200px) canvas for the watch.
      const max=200; let w=img.width,h=img.height;
      if(w>h&&w>max){ h=Math.round(h*max/w); w=max; } else if(h>max){ w=Math.round(w*max/h); h=max; }
      const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      let smallUrl=null, origUrl=null;
      // small -> Supabase
      try{ smallUrl=await new Promise((res)=>{ c.toBlob(async(b)=>{ try{ const name=(App.me?App.me.id:'x')+'_'+Date.now()+'.png'; res(await uploadToStorage(name,b,'image/png')); }catch(e){ res(null); } },'image/png'); }); }catch(e){}
      // original -> external temp host (litterbox), not Supabase
      try{ if(origBlob.size<=100*1024*1024){ const up=await uploadTempFile(new File([origBlob],'photo_'+Date.now()+'.jpg',{type:origBlob.type||'image/jpeg'})); origUrl=up&&up.url; } }catch(e){}
      if(smallUrl && origUrl){ resolve(MEDIA_PREFIX+'img|url2|'+smallUrl+'|'+origUrl); }
      else if(smallUrl){ resolve(MEDIA_PREFIX+'img|url|'+smallUrl); }
      else if(origUrl){ resolve(MEDIA_PREFIX+'img|url|'+origUrl); }
      else { toast('Image upload failed'); resolve(null); }
    };
    img.onerror=()=>resolve(null);
    const rd=new FileReader(); rd.onload=()=>img.src=rd.result; rd.readAsDataURL(origBlob);
  });
}

// Remove background from an image blob using @imgly/background-removal (client-side, WASM).
// Fallback: simple edge flood-fill removal if the library can't load.
async function removeBg(fileOrBlob){
  try{
    const mod=await import('https://esm.sh/@imgly/background-removal@1.5.5');
    const remove=mod.removeBackground||mod.default;
    const blob=await remove(fileOrBlob);
    return blob;
  }catch(e){
    // Fallback: flood-fill from the 4 borders removing pixels similar to corner color.
    return await new Promise((resolve)=>{
      const img=new Image(); img.onload=()=>{
        const S=320; let w=img.width,h=img.height; const sc=Math.min(S/w,S/h,1); w=Math.round(w*sc); h=Math.round(h*sc);
        const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        const id=ctx.getImageData(0,0,w,h); const d=id.data; const seen=new Uint8Array(w*h);
        const corner=[d[0],d[1],d[2]]; const tol=48; const stack=[];
        const push=(x,y)=>{ if(x<0||y<0||x>=w||y>=h)return; const i=y*w+x; if(seen[i])return; seen[i]=1; stack.push(i); };
        for(let x=0;x<w;x++){push(x,0);push(x,h-1);} for(let y=0;y<h;y++){push(0,y);push(w-1,y);}
        while(stack.length){ const i=stack.pop(); const p=i*4; const dr=Math.abs(d[p]-corner[0])+Math.abs(d[p+1]-corner[1])+Math.abs(d[p+2]-corner[2]); if(dr<tol){ d[p+3]=0; const x=i%w,y=(i/w)|0; push(x+1,y);push(x-1,y);push(x,y+1);push(x,y-1); } }
        ctx.putImageData(id,0,0); c.toBlob(b=>resolve(b),'image/png');
      }; img.onerror=()=>resolve(fileOrBlob); const rd=new FileReader(); rd.onload=()=>img.src=rd.result; rd.readAsDataURL(fileOrBlob);
    });
  }
}
// Create sticker: pick image -> cut out background -> EDITOR (preview on
// transparent checkerboard) -> Save & Send. Saves the PNG to storage + local list.
async function createStickerFlow(onDone){
  const i=document.createElement('input'); i.type='file'; i.accept='image/*';
  i.onchange=async()=>{ const f=i.files&&i.files[0]; if(!f){ return; }
    toast(T('cuttingOut'));
    let blob; try{ blob=await removeBg(f); }catch(e){ blob=f; }
    // Render cut-out onto a sticker-sized transparent canvas.
    const canvas=await new Promise((resolve)=>{ const img=new Image(); img.onload=()=>{ const max=320; let w=img.width,h=img.height; const sc=Math.min(max/w,max/h,1); w=Math.round(w*sc); h=Math.round(h*sc); const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.clearRect(0,0,w,h); ctx.drawImage(img,0,0,w,h); resolve(c); }; img.onerror=()=>resolve(null); const rd=new FileReader(); rd.onload=()=>img.src=rd.result; rd.readAsDataURL(blob); });
    if(!canvas){ toast(T('uploadFail')); return; }
    // Editor overlay
    const ov=el('div','stkedit');
    const prev=el('div','stkprev'); const pim=document.createElement('img'); pim.src=canvas.toDataURL('image/png'); prev.appendChild(pim); ov.appendChild(prev);
    const row=el('div','stkrow');
    const again=el('button','sbtn'); again.style.background='#33333a'; again.style.color='#fff'; again.textContent=T('retake');
    const save=el('button','sbtn'); save.style.background='#25d366'; save.style.color='#fff'; save.textContent='💾 '+T('sendPhoto');
    const cancel=el('button','sbtn'); cancel.style.background='#4d1f1f'; cancel.style.color='#ffaaaa'; cancel.textContent=T('cancel');
    row.appendChild(again); row.appendChild(save); row.appendChild(cancel); ov.appendChild(row);
    document.body.appendChild(ov);
    again.onclick=()=>{ ov.remove(); createStickerFlow(onDone); };
    cancel.onclick=()=>{ ov.remove(); };
    save.onclick=async()=>{ save.disabled=true; toast('Uploading…'); canvas.toBlob(async(b)=>{ try{ const name='stk_'+(App.me?App.me.id:'x')+'_'+Date.now()+'.png'; const u=await uploadToStorage(name,b,'image/png'); addMySticker(u); ov.remove(); onDone(u); }catch(e){ toast(T('uploadFail')); save.disabled=false; } },'image/png'); };
  };
  i.click();
}

function buildWaComposer(opts){
  opts=opts||{};
  const comp=el('div','wacomposer');
  const pill=el('div','wapill');
  const photo=svgBtn('waic','sticker','Stickers');
  const inp=document.createElement('input'); inp.type='text'; inp.placeholder=opts.placeholder||T('message');
  const file=svgBtn('waic','clip','Attach');
  const cam=svgBtn('waic','camera','Camera');
  const game=svgBtn('waic','game','Games');
  pill.appendChild(photo); pill.appendChild(inp);
  if(opts.onFile) pill.appendChild(file);
  if(opts.onGame) pill.appendChild(game);
  pill.appendChild(cam);
  comp.appendChild(pill);
  const green=el('button','wamic'); green.innerHTML=WAICONS.mic;
  comp.appendChild(green);
  // Morph mic <-> send based on input content.
  const setMode=()=>{ const has=inp.value.trim().length>0; if(has){ green.classList.add('sendmode'); green.innerHTML=WAICONS.send; } else { green.classList.remove('sendmode'); green.innerHTML=WAICONS.mic; } };
  inp.addEventListener('input',setMode); setMode();
  photo.onclick=()=>{ if(opts.onSticker) opts.onSticker(); };
  file.onclick=()=>{ if(opts.onFile) opts.onFile(); };
  cam.onclick=()=>{ if(opts.onCamera) opts.onCamera(); };
  game.onclick=()=>{ if(opts.onGame) opts.onGame(); };
  green.addEventListener('click',(e)=>{ if(green.classList.contains('sendmode')){ e.preventDefault(); if(opts.onSend) opts.onSend(); } });
  if(opts.onAudio) attachHoldToRecord(green, opts.onAudio);
  return { comp, inp, green, setMode };
}
function recordAudioDialog(){return new Promise(async resolve=>{

/* =====================================================================
   NotifSound — suono di notifica (solo da PC) quando arriva un nuovo
   messaggio DM mentre la scheda del browser NON è in primo piano.
   Monitora i messaggi in arrivo indipendentemente dalla sezione aperta.
   ===================================================================== */
const NotifSound=(function(){
  let poll=null, lastMaxId=0, primed=false, actx=null;
  function ensureCtx(){ if(!actx){ try{ const AC=window.AudioContext||window.webkitAudioContext; actx=new AC(); }catch(e){ actx=null; } } if(actx&&actx.state==='suspended'){ actx.resume().catch(()=>{}); } return actx; }
  // Sblocca l'audio al primo gesto utente (policy autoplay dei browser).
  function unlock(){ ensureCtx(); }
  window.addEventListener('pointerdown',unlock,{once:true});
  window.addEventListener('keydown',unlock,{once:true});
  function ding(){
    const ctx=ensureCtx(); if(!ctx) return;
    try{ const t=ctx.currentTime;
      [[0,880],[0.14,1174]].forEach(([off,freq])=>{
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0,t+off); g.gain.linearRampToValueAtTime(0.22,t+off+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+off+0.28);
        o.start(t+off); o.stop(t+off+0.3);
      });
    }catch(e){}
  }
  async function check(){
    if(!App.me || isMobile()) return;
    try{
      const rows=await rest('/dm_threads?or=(user_lo.eq.'+App.me.id+',user_hi.eq.'+App.me.id+')&select=id'); 
      const tids=(rows||[]).map(t=>t.id); if(!tids.length) return;
      const ms=await rest('/dm_messages?thread_id=in.('+tids.join(',')+')&sender_id=neq.'+App.me.id+'&select=id&order=id.desc&limit=1');
      const maxId=(ms&&ms.length)?ms[0].id:0;
      if(!primed){ lastMaxId=maxId; primed=true; return; } // baseline: nessun suono al primo giro
      if(maxId>lastMaxId){
        const isNew=lastMaxId>0; lastMaxId=maxId;
        // Suona solo se la scheda NON è in primo piano.
        if(isNew && document.hidden){ ding(); }
      }
    }catch(e){}
  }
  function start(){ stop(); check(); poll=setInterval(check,4000); }
  function stop(){ if(poll){ clearInterval(poll); poll=null; } }
  return { start, stop };
})();
window.NotifSound=NotifSound;

    success:function(id){ var st=state[id]; if(st){st.done=st.total||st.done;st.failed=null;} if(isActive(id)){ render(id); setMode('ok'); el.title.textContent=t('done'); el.sub.textContent=''; clearTimeout(hideTimer); hideTimer=setTimeout(hide,1200);} delete state[id]; document.dispatchEvent(new CustomEvent('winky:decrypt-success',{detail:{chatId:id}})); },
    fail:function(id,err){ err=err||{}; state[id]=state[id]||{done:0,total:0}; state[id].failed={code:err.code||'DECRYPT_ERR',reason:err.reason||err.message||''}; if(err.retry)state[id].retry=err.retry; if(isActive(id))render(id); document.dispatchEvent(new CustomEvent('winky:decrypt-fail',{detail:{chatId:id,error:state[id].failed}})); },
    isBusy:function(id){ var st=state[id]; return !!(st&&!st.failed); },
    shouldMask:function(id){ var st=state[id]; return !!(st&&!st.failed); },
    isFailed:function(id){ var st=state[id]; return !!(st&&st.failed); },
    setActiveChat:function(id){ activeChat=id; if(!el.root)return; if(state[id])render(id); else hide(); },
    clear:function(id){ delete state[id]; if(isActive(id))hide(); },
    dismiss:hide
  };
  window.WinkyDecrypt=API;
})();
</script>

<!-- Easter egg "Kinky Community": si attiva SOLO con @kinky + Invio. Client-side, solo sessione. -->
<script id="kinky-egg">
/* ===== KINKY COMMUNITY — easter egg (client-side, session-only) =====
   Scrivi @kinky in una chat e premi INVIO: l'app diventa "Kinky Community"
   (nome + tema + sfondo + menu). Riscrivi @kinky + INVIO per disattivare.
   Solo per chi carica questo script, solo per la sessione. Il token NON
   viene inviato in chat.
   NB: rename via observer DEBOUNCED + PAUSATO durante le modifiche e con
   walk-DOM al massimo ogni 600ms → nessun freeze. */
(function () {
  'use strict';
  var TOKEN='@kinky', KEY='kinky_egg_on', FROM='Winky Community', TO='Kinky Community';
  var ON=false; try{ ON=sessionStorage.getItem(KEY)==='1'; }catch(e){}

  /* ---- theme CSS (solo classe su <html>, nessun re-apply necessario) ---- */
  function css(){ return [
    ":root.kinky{",
      "--bg:#12000a;--panel:#220412;--panel2:#2e0819;",
      "--accent:#ff1e88;--text:#ffe3f0;--muted:#ef98c2;",
      "--bubbleMine:#7a0b3a;--bubbleTheirs:#2a0716;--border:#4a1030;--listItem:#1b0410;",
      "--btnPrimary:#c2185b;--btnGrey:#3a1230;--btnDark:#1a0410;--btnGreen:#8a1250;",
      "--btnDanger:#4d0f2a;--btnDangerTxt:#ffb3d4;--btnWarn:#8a2a5a;--btnTxt:#fff;",
      "--inputBg:#260a1a;--inputBorder:#5a1740;",
    "}",
    ":root.kinky, :root.kinky body{background:#12000a !important;}",
    ":root.kinky body{background-image:",
      "radial-gradient(1200px 800px at 15% -10%, #3a0620 0%, #17010c 55%, #0a0006 100%),",
      "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><text x='16' y='40' font-size='26' opacity='0.06'>%F0%9F%92%8B</text><text x='70' y='90' font-size='24' opacity='0.06'>%E2%9B%93</text><text x='30' y='104' font-size='22' opacity='0.05'>%F0%9F%94%A5</text></svg>\")",
      " !important;background-attachment:fixed,fixed !important;background-repeat:no-repeat,repeat !important;}",
    ":root.kinky button.btn{background:linear-gradient(180deg,#ff2d8f,#a2124f) !important;color:#fff !important;box-shadow:0 3px 0 rgba(0,0,0,.4),0 0 16px rgba(255,45,143,.35) !important;}",
    ":root.kinky button.btn.grey,:root.kinky button.btn.dark{background:#3a1230 !important;color:#ffd7ea !important;box-shadow:none !important;}",
    ":root.kinky .title,:root.kinky #hTitle{color:#ff4fa3 !important;text-shadow:0 0 10px rgba(255,45,143,.55);}",
    ":root.kinky .bubble.mine{box-shadow:0 0 14px rgba(255,45,143,.25) !important;}",
    ":root.kinky ::selection{background:#ff2d8f;color:#12000a;}",
    ":root.kinky ::-webkit-scrollbar-thumb{background:#ff2d8f !important;}",
    ":root.kinky #navRail .nr-btn.active{background:#ff2d8f !important;color:#1a0410 !important;}",
    ":root.kinky .bottomnav .navtab.active{color:#ff4fa3 !important;}",
    "#kinky-fx{position:fixed;inset:0;pointer-events:none;z-index:2147483000;overflow:hidden}",
    "#kinky-fx span{position:absolute;bottom:-42px;will-change:transform,opacity;animation:kinkyRise linear forwards;filter:drop-shadow(0 0 6px rgba(255,45,143,.5))}",
    "@keyframes kinkyRise{to{transform:translateY(-112vh) rotate(360deg);opacity:0}}",
    "#kinky-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:2147483600;",
      "background:linear-gradient(90deg,#ff2d8f,#a2124f);color:#fff;font:700 14px system-ui,Arial;",
      "padding:10px 16px;border-radius:999px;box-shadow:0 8px 26px rgba(255,45,143,.55);letter-spacing:.3px}"
  ].join(''); }

  function styleEl(){ var s=document.getElementById('kinky-style'); if(!s){ s=document.createElement('style'); s.id='kinky-style'; document.head.appendChild(s);} return s; }

  function toast(msg){ var t=document.getElementById('kinky-toast'); if(!t){ t=document.createElement('div'); t.id='kinky-toast'; document.body.appendChild(t);} t.textContent=msg; t.style.opacity='1';
    clearTimeout(t.__k); t.__k=setTimeout(function(){ t.style.transition='opacity .4s'; t.style.opacity='0'; }, 1800); }

  /* ---- rename brand: SOLO nodi di testo che contengono il brand, con
     observer DEBOUNCED e PAUSATO durante l'esecuzione (niente ricorsione,
     niente freeze). Non tocca mai la struttura: cambia solo nodeValue. ---- */
  var origTitle=null, mo=null, applying=false, scheduled=false, lastRun=0;

  function swapTextNodes(a, b){
    var body=document.body; if(!body) return;
    var w=document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
      acceptNode:function(n){
        if(!n.nodeValue || n.nodeValue.indexOf(a)<0) return NodeFilter.FILTER_REJECT;
        var p=n.parentNode;
        // salta script/style e i nostri stessi nodi fx/toast
        while(p){ if(p.nodeType===1){ var tag=p.tagName, id=p.id;
          if(tag==='SCRIPT'||tag==='STYLE') return NodeFilter.FILTER_REJECT;
          if(id==='kinky-fx'||id==='kinky-toast'||id==='kinky-style') return NodeFilter.FILTER_REJECT;
        } p=p.parentNode; }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var n, list=[]; while((n=w.nextNode())) list.push(n);
    for(var i=0;i<list.length;i++){ list[i].nodeValue = list[i].nodeValue.split(a).join(b); }
  }

  function applyBrand(on){
    // pausa l'observer per non reagire alle nostre stesse modifiche
    if(mo) try{ mo.disconnect(); }catch(e){}
    applying=true;
    try{
      if(on){
        if(origTitle==null) origTitle=document.title;
        if(document.title.indexOf(TO)<0) document.title = (document.title.indexOf(FROM)>=0)? document.title.split(FROM).join(TO) : TO;
        swapTextNodes(FROM, TO);
      } else {
        if(origTitle!=null) document.title=origTitle;
        swapTextNodes(TO, FROM);
      }
    }catch(e){}
    applying=false;
    if(ON && mo){ try{ mo.observe(document.documentElement,{childList:true,subtree:true,characterData:false}); }catch(e){} }
  }

  function scheduleRename(){
    if(scheduled) return;
    scheduled=true;
    var run=function(){
      scheduled=false;
      if(!ON) return;
      lastRun=Date.now();
      applyBrand(true);
    };
    // throttle a max 1 volta ogni 600ms
    var wait=Math.max(0, 600-(Date.now()-lastRun));
    setTimeout(function(){ (window.requestAnimationFrame||function(f){f();})(run); }, wait);
  }

  function startObserver(){
    if(mo) return;
    mo=new MutationObserver(function(muts){
      if(!ON || applying) return;
      // ignora se le mutazioni toccano SOLO i nostri nodi (fx/toast/style)
      for(var i=0;i<muts.length;i++){
        var t=muts[i].target, id=t && t.id;
        if(id==='kinky-fx'||id==='kinky-toast'||id==='kinky-style') continue;
        // una mutazione "vera" dell'app → pianifica un rename throttled
        scheduleRename();
        return;
      }
    });
    try{ mo.observe(document.documentElement,{childList:true,subtree:true,characterData:false}); }catch(e){}
  }
  function stopObserver(){ if(mo){ try{ mo.disconnect(); }catch(e){} mo=null; } }

  /* ---- emoji fx (leggero: intervallo lento + cap sul numero) ---- */
  var fxTimer=null;
  var EMO=['\uD83D\uDE08','\uD83D\uDD25','\uD83D\uDC8B','\u26D3\uFE0F','\uD83E\uDD75','\uD83D\uDC84','\uD83D\uDC60','\uD83C\uDF36\uFE0F','\uD83D\uDDA4','\uD83D\uDC9C'];
  function fxStart(){ var layer=document.getElementById('kinky-fx'); if(!layer){ layer=document.createElement('div'); layer.id='kinky-fx'; document.body.appendChild(layer);} if(fxTimer) return;
    fxTimer=setInterval(function(){
      if(document.hidden) return;
      if(layer.childElementCount>14) return; // cap
      var s=document.createElement('span'); s.textContent=EMO[Math.floor(Math.random()*EMO.length)];
      s.style.left=(Math.random()*100)+'vw'; var d=(5+Math.random()*5).toFixed(1);
      s.style.animationDuration=d+'s'; s.style.fontSize=(16+Math.random()*22)+'px';
      layer.appendChild(s); setTimeout(function(){ if(s&&s.parentNode) s.parentNode.removeChild(s); }, d*1000+250);
    }, 900); }
  function fxStop(){ if(fxTimer){ clearInterval(fxTimer); fxTimer=null; } var l=document.getElementById('kinky-fx'); if(l&&l.parentNode) l.parentNode.removeChild(l); }

  /* ---- toggle ---- */
  function setState(on){
    ON=on; try{ sessionStorage.setItem(KEY, on?'1':'0'); }catch(e){}
    if(on){
      styleEl().textContent=css();
      document.documentElement.classList.add('kinky');
      applyBrand(true);
      startObserver();
      fxStart();
      toast('\uD83D\uDE08 '+TO+' attivata \u2014 Dove i Winky diventano cattivi \uD83D\uDD25');
    } else {
      stopObserver();
      document.documentElement.classList.remove('kinky');
      styleEl().textContent='';
      applyBrand(false);
      fxStop();
      toast('\uD83D\uDE07 Ok ok\u2026 '+FROM+' ripristinata');
    }
  }
  function toggle(){ setState(!ON); }

  /* ---- trigger: SOLO su INVIO in un composer ---- */
  function isComposer(el){ if(!el) return false;
    if(el.matches && el.matches('input[type="text"],textarea,[contenteditable="true"],[contenteditable=""]')){
      return !!(el.closest && (el.closest('.wacomposer')||el.closest('.wapill')||el.closest('.composer')||el.closest('#app')));
    }
    return false; }
  function valOf(el){ return ('value' in el && el.value!=null) ? String(el.value) : (el.textContent||''); }
  function clearToken(el){ if('value' in el && el.value!=null){ el.value=el.value.split(TOKEN).join('').trim(); } else { el.textContent=(el.textContent||'').split(TOKEN).join('').trim(); } try{ el.dispatchEvent(new Event('input',{bubbles:true})); }catch(e){} }

  document.addEventListener('keydown', function(ev){
    if(ev.key!=='Enter' || ev.shiftKey) return;
    var el=ev.target;
    if(!isComposer(el)) return;
    if(valOf(el).toLowerCase().indexOf(TOKEN)>=0){
      ev.preventDefault(); ev.stopImmediatePropagation();
      clearToken(el);
      // esegui il toggle fuori dal gestore tastiera (evita jank sull'handler dell'app)
      setTimeout(toggle, 0);
    }
  }, true);

  /* ---- restore su reload nella stessa sessione ---- */
  function boot(){ if(ON){ styleEl().textContent=css(); document.documentElement.classList.add('kinky'); applyBrand(true); startObserver(); fxStart(); } }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();

  window.KinkyEgg={ toggle:toggle, on:function(){ setState(true); }, off:function(){ setState(false); }, isOn:function(){ return ON; } };
})();
</script>
<!-- KINKY-EGG END -->
